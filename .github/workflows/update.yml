name: Update feed
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 deep-translator curl_cffi
      - run: python macked_rss.py --pages 2
        env:
          FETCH_PROXY: ${{ secrets.FETCH_PROXY }}
          TRANSLATOR: mymemory
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml macked_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update feed"
            git push
          fi
